services:
  - type: web
    name: emarkafe-backend
    runtime: node
    plan: free
    region: frankfurt
    branch: master
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@emarkafe.com
      - key: ADMIN_PASSWORD
        sync: false
